<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>后台 · 开源平替</title>
<style>
  :root{--brand:#1f3864;--brand2:#2e75b6;--ink:#1c2330;--muted:#5f6b7a;--line:#e3e9f1;--bg:#f7f9fc;--card:#fff}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
  header{background:#fff;border-bottom:1px solid var(--line);padding:12px 20px;display:flex;align-items:center;gap:16px}
  header b{color:var(--brand);font-size:18px}
  header a{color:var(--muted);font-size:13px;margin-left:auto;text-decoration:none}
  .wrap{max-width:1180px;margin:0 auto;padding:20px}
  .login{max-width:360px;margin:12vh auto;background:#fff;border:1px solid var(--line);border-radius:14px;padding:28px}
  .login h1{margin:0 0 6px;font-size:22px;color:var(--brand)}
  .login p{margin:0 0 18px;color:var(--muted);font-size:14px}
  input,textarea,select{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;font:inherit;color:inherit;background:#fff}
  textarea{resize:vertical;min-height:90px}
  button{border:0;border-radius:8px;padding:10px 16px;font:inherit;font-weight:600;cursor:pointer;background:var(--brand);color:#fff}
  button.ghost{background:#fff;color:var(--brand);border:1px solid var(--line)}
  button.danger{background:#fff;color:#b91c1c;border:1px solid #fecaca}
  .err{color:#b91c1c;font-size:13px;min-height:20px;margin-top:8px}
  .layout{display:grid;grid-template-columns:280px 1fr;gap:16px}
  .panel{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px}
  .list{max-height:calc(100vh - 180px);overflow:auto;margin-top:10px}
  .item{padding:9px 10px;border-radius:8px;cursor:pointer;font-size:14px}
  .item:hover{background:var(--bg)}
  .item.on{background:#eef4fb;color:var(--brand);font-weight:600}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .field{margin-bottom:12px}
  .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
  .actions{display:flex;gap:10px;align-items:center;margin-top:6px}
  .status{margin-left:auto;font-size:13px;color:var(--muted)}
  .status.ok{color:#15803d}
  .status.bad{color:#b91c1c}
  .empty{padding:40px;text-align:center;color:var(--muted)}
</style>
</head>
<body>
<header>
  <b>开源平替 · 后台</b>
  <a href="/" target="_blank">查看网站</a>
  <a href="#" id="logout" hidden>退出</a>
</header>

<div id="loginView" class="login" hidden>
  <h1>管理登录</h1>
  <p>输入后台密码后可以修改工具内容，保存即发布。</p>
  <input id="password" type="password" placeholder="后台密码" autocomplete="current-password">
  <div class="actions"><button id="loginBtn">登录</button></div>
  <div class="err" id="loginErr"></div>
</div>

<div id="appView" class="wrap" hidden>
  <div class="layout">
    <aside class="panel">
      <input id="filter" placeholder="搜索工具…">
      <button class="ghost" id="addBtn" style="width:100%;margin-top:8px">+ 新增工具</button>
      <div class="list" id="list"></div>
    </aside>
    <main class="panel">
      <div id="empty" class="empty">左边选一个工具，或新增一个。</div>
      <form id="form" hidden>
        <div class="row">
          <div class="field"><label>显示名</label><input name="name"></div>
          <div class="field"><label>slug（网址用，别改）</label><input name="slug" readonly></div>
        </div>
        <div class="row">
          <div class="field"><label>分类</label><input name="category" placeholder="图片 / 办公 / 视频…"></div>
          <div class="field"><label>替代的付费软件（逗号分隔）</label><input name="replaces"></div>
        </div>
        <div class="field"><label>一句话简介</label><textarea name="summary" style="min-height:60px"></textarea></div>
        <div class="field"><label>结论（能替多少、哪里不行）</label><textarea name="verdict" style="min-height:60px"></textarea></div>
        <div class="field"><label>评测正文（空行分段）</label><textarea name="review" style="min-height:180px"></textarea></div>
        <div class="row">
          <div class="field"><label>值得装（一行一条）</label><textarea name="pros" style="min-height:110px"></textarea></div>
          <div class="field"><label>做不到（一行一条）</label><textarea name="cons" style="min-height:110px"></textarea></div>
        </div>
        <div class="row">
          <div class="field"><label>平台（逗号分隔）</label><input name="platforms"></div>
          <div class="field"><label>许可证</label><input name="license"></div>
        </div>
        <div class="row">
          <div class="field"><label>GitHub 仓库</label><input name="repo" placeholder="owner/repo"></div>
          <div class="field"><label>官网</label><input name="homepage"></div>
        </div>
        <div class="field"><label>下载链接</label><input name="download"></div>
        <div class="row">
          <div class="field"><label>星标</label><input name="stars" type="number"></div>
          <div class="field"><label>增速 / 天</label><input name="growth" type="number"></div>
        </div>
        <div class="row">
          <div class="field"><label>状态</label>
            <select name="trend"><option value="up">本周上升</option><option value="evergreen">长青工具</option></select>
          </div>
          <div class="field"><label>收录日期</label><input name="added" placeholder="2026-10-31"></div>
        </div>
        <div class="actions">
          <button type="submit">保存并发布</button>
          <button type="button" class="danger" id="delBtn">删除</button>
          <span class="status" id="status"></span>
        </div>
      </form>
    </main>
  </div>
</div>

<script>
(function(){
  const $ = (s) => document.querySelector(s);
  let tools = [], idx = -1;

  async function api(path, opts){
    const res = await fetch(path, Object.assign({credentials:'same-origin'}, opts));
    if (res.status === 401) { showLogin(); throw new Error('unauthorized'); }
    const data = await res.json().catch(()=>({}));
    if (!res.ok) throw new Error(data.error || ('HTTP ' + res.status));
    return data;
  }

  function showLogin(){ $('#loginView').hidden = false; $('#appView').hidden = true; $('#logout').hidden = true; }
  function showApp(){ $('#loginView').hidden = true; $('#appView').hidden = false; $('#logout').hidden = false; }

  async function load(){
    try {
      const data = await api('/api/tools');
      tools = data.tools || [];
      showApp();
      renderList();
    } catch(e) { if (e.message !== 'unauthorized') setLoginErr(e.message); }
  }

  function renderList(){
    const q = ($('#filter').value || '').toLowerCase();
    const box = $('#list');
    box.innerHTML = '';
    tools.forEach((t, i) => {
      if (q && !(t.name + ' ' + t.slug + ' ' + (t.replaces||[]).join(' ')).toLowerCase().includes(q)) return;
      const div = document.createElement('div');
      div.className = 'item' + (i === idx ? ' on' : '');
      div.textContent = t.name || t.slug;
      div.onclick = () => select(i);
      box.appendChild(div);
    });
  }

  function fill(t){
    const f = $('#form');
    f.name.value = t.name || '';
    f.slug.value = t.slug || '';
    f.category.value = t.category || '';
    f.replaces.value = (t.replaces || []).join('，');
    f.summary.value = t.summary || '';
    f.verdict.value = t.verdict || '';
    f.review.value = t.review || '';
    f.pros.value = (t.pros || []).join('\n');
    f.cons.value = (t.cons || []).join('\n');
    f.platforms.value = (t.platforms || []).join('，');
    f.license.value = t.license || '';
    f.repo.value = t.repo || '';
    f.homepage.value = t.homepage || '';
    f.download.value = t.download || '';
    f.stars.value = t.stars || 0;
    f.growth.value = t.growth || 0;
    f.trend.value = t.trend || 'up';
    f.added.value = t.added || new Date().toISOString().slice(0,10);
    $('#empty').hidden = true;
    f.hidden = false;
  }

  function select(i){ idx = i; renderList(); fill(tools[i]); $('#status').textContent = ''; }

  function collect(){
    const f = $('#form');
    const t = tools[idx];
    t.name = f.name.value.trim();
    t.slug = f.slug.value.trim();
    t.category = f.category.value.trim();
    t.replaces = f.replaces.value.split(/[，,]/).map(s=>s.trim()).filter(Boolean);
    t.summary = f.summary.value.trim();
    t.verdict = f.verdict.value.trim();
    t.review = f.review.value.trim();
    t.pros = f.pros.value.split('\n').map(s=>s.trim()).filter(Boolean);
    t.cons = f.cons.value.split('\n').map(s=>s.trim()).filter(Boolean);
    t.platforms = f.platforms.value.split(/[，,]/).map(s=>s.trim()).filter(Boolean);
    t.license = f.license.value.trim();
    t.repo = f.repo.value.trim();
    t.homepage = f.homepage.value.trim();
    t.download = f.download.value.trim();
    t.stars = Number(f.stars.value) || 0;
    t.growth = Number(f.growth.value) || 0;
    t.trend = f.trend.value;
    t.added = f.added.value.trim();
  }

  function setStatus(msg, cls){ const s = $('#status'); s.textContent = msg; s.className = 'status ' + (cls||''); }
  function setLoginErr(msg){ $('#loginErr').textContent = msg || ''; }

  $('#loginBtn').onclick = async () => {
    setLoginErr('');
    try {
      await api('/api/login', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({password: $('#password').value})});
      await load();
    } catch(e) { setLoginErr(e.message === 'unauthorized' ? '密码不对' : e.message); }
  };
  $('#password').addEventListener('keydown', e => { if (e.key === 'Enter') $('#loginBtn').click(); });

  $('#logout').onclick = async (e) => { e.preventDefault(); await fetch('/api/logout', {method:'POST'}); showLogin(); };

  $('#filter').oninput = renderList;

  $('#addBtn').onclick = () => {
    tools.push({slug:'new-tool-' + Date.now(), name:'新工具', category:'其他', replaces:[], summary:'', verdict:'', review:'', pros:[], cons:[], platforms:[], license:'', repo:'', homepage:'', download:'', stars:0, growth:0, trend:'up', added:new Date().toISOString().slice(0,10)});
    idx = tools.length - 1; renderList(); fill(tools[idx]); setStatus('新增的还没发布，填完点保存。');
  };

  $('#delBtn').onclick = () => {
    if (idx < 0) return;
    if (!confirm('确定删除「' + (tools[idx].name || tools[idx].slug) + '」？保存后生效。')) return;
    tools.splice(idx, 1); idx = -1; $('#form').hidden = true; $('#empty').hidden = false; renderList(); setStatus('已从列表移除，点保存后发布。');
  };

  $('#form').onsubmit = async (e) => {
    e.preventDefault();
    if (idx < 0) return;
    collect();
    setStatus('保存中…');
    try {
      await api('/api/tools', {method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify({tools})});
      renderList();
      setStatus('已保存，Cloudflare 约 1–2 分钟后上线。', 'ok');
    } catch(err) { setStatus('保存失败：' + err.message, 'bad'); }
  };

  load();
})();
</script>
</body>
</html>
