  <h1>关于这个站</h1>
  <p class="lead">每天 1–2 个突然走红的开源软件，只回答一个问题：它能不能替掉你正在付费的那个。</p>

  <h2>怎么评的</h2>
  <p>每期都自己装一遍，用真实文件跑一遍，再写三件事：能替多少、哪里不行、装完要注意什么。只写优点、不提缺点的评测，没有价值。</p>

  <h2>免责声明</h2>
  <p>开源软件的使用条款以项目仓库为准；下载前请确认许可证和平台。本站只做信息整理与实测记录，不对项目本身的安全性和后续维护负责。</p>
